<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VC ռազմավարությունների համեմատական վերլուծություն</title>

<style>
:root{
  --bg:#09111f;--panel:rgba(17,28,48,.9);--panel-solid:#111c30;
  --text:#f4f7ff;--muted:#adbad0;--line:rgba(255,255,255,.13);
  --accent:#92aaff;--shadow:0 18px 60px rgba(0,0,0,.25);
}
body.light{
  --bg:#eef2f9;--panel:rgba(255,255,255,.92);--panel-solid:#fff;
  --text:#16233b;--muted:#59677c;--line:rgba(16,32,54,.14);
  --accent:#365fe5;--shadow:0 18px 60px rgba(31,47,74,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:.2s}

.topbar{
  height:66px;position:fixed;inset:0 0 auto;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:var(--panel);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line)
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand-mark{
  width:36px;height:36px;display:grid;place-items:center;border-radius:12px;
  color:white;background:linear-gradient(135deg,#587cff,#ae5bf2)
}
.tools{display:flex;gap:8px}
.tool,.nav-btn,.org-tab,.speaker-btn,.close{
  color:var(--text);background:var(--panel);border:1px solid var(--line);
  border-radius:11px;cursor:pointer;transition:.18s
}
.tool{width:40px;height:40px;font-size:18px}
.tool:hover,.nav-btn:hover,.org-tab:hover,.speaker-btn:hover{border-color:var(--accent);transform:translateY(-1px)}

aside{
  position:fixed;top:66px;bottom:0;left:0;width:230px;z-index:20;
  padding:17px 12px;overflow:auto;background:var(--panel);
  border-right:1px solid var(--line);backdrop-filter:blur(18px)
}
.nav-label{padding:8px 10px 12px;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.nav-btn{
  display:flex;align-items:center;gap:9px;width:100%;padding:10px;margin:3px 0;
  text-align:left;background:transparent;border-color:transparent;color:var(--muted)
}
.nav-btn.active{background:rgba(117,145,255,.16);color:var(--text);border-color:rgba(117,145,255,.28)}
.nav-num{font-size:11px;opacity:.65;min-width:20px}

main{margin-left:230px;padding:26px clamp(15px,4vw,58px) 55px}
.slide{display:none;max-width:1200px;margin:auto;animation:enter .28s ease}
.slide.active{display:block}
@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.hero{
  position:relative;overflow:hidden;min-height:235px;padding:30px;
  border:1px solid var(--line);border-radius:25px;box-shadow:var(--shadow);
  background:
    radial-gradient(ellipse at 85% 12%,rgba(81,128,255,.28),transparent 37%),
    radial-gradient(ellipse at 95% 100%,rgba(174,75,240,.22),transparent 42%),
    linear-gradient(120deg,rgba(23,39,68,.96),rgba(14,23,42,.85))
}
body.light .hero{
  background:
    radial-gradient(ellipse at 85% 12%,rgba(81,128,255,.17),transparent 37%),
    radial-gradient(ellipse at 95% 100%,rgba(174,75,240,.12),transparent 42%),
    linear-gradient(120deg,#fff,#edf1fa)
}
.hero:after{
  content:"";position:absolute;right:6%;top:14%;width:175px;height:175px;
  border:1px solid rgba(255,255,255,.15);border-radius:50%;
  box-shadow:0 0 0 24px rgba(255,255,255,.025),0 0 0 48px rgba(255,255,255,.02);
  pointer-events:none
}
.speaker-corner{position:absolute;top:15px;left:15px;z-index:2}
.speaker-btn{padding:8px 11px;color:#fff;background:rgba(8,14,27,.65);border-color:rgba(255,255,255,.25)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{max-width:820px;margin:14px 0;font-size:clamp(28px,4.2vw,48px);line-height:1.1;letter-spacing:-.04em}
h2{margin:0 0 9px;font-size:clamp(21px,2.6vw,29px)}
h3{margin:0 0 9px;font-size:17px}
p{margin:8px 0;color:var(--muted);line-height:1.7}
.hero p{max-width:760px;font-size:15px}

.content-head{margin:24px 0 12px}
.content-head p{font-size:13px;margin:0}
.org-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.org-tab{padding:9px 14px;color:var(--muted)}
.org-tab.active{color:white;border-color:transparent;background:var(--org)}
.org-panel{display:none}
.org-panel.active{display:block;animation:enter .22s ease}
.org-panel[data-org="sequoia"]{--org:#24b985}
.org-panel[data-org="softbank"]{--org:#f28c55}
.org-panel[data-org="gv"]{--org:#748fff}

.org-overview{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.card{padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.accent-card{border-top:3px solid var(--org)}
.tag{
  display:inline-block;padding:5px 9px;margin:3px 3px 0 0;border-radius:99px;
  font-size:12px;color:var(--org);background:color-mix(in srgb,var(--org),transparent 88%);
  border:1px solid color-mix(in srgb,var(--org),transparent 65%)
}
.metric-grid,.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:13px}
.metric strong{display:block;font-size:21px}
.metric span{font-size:12px;color:var(--muted)}
.bar-list{display:grid;gap:13px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:105px 1fr 55px;gap:9px;align-items:center;font-size:12px;color:var(--muted)}
.bar{height:9px;background:rgba(140,155,185,.17);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#587cff,#ae5bf2)}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.time-item{border-top:2px solid var(--accent)}
.time-item strong{display:block;color:var(--accent);margin-bottom:7px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;margin-top:14px}
table{width:100%;min-width:650px;border-collapse:collapse;background:var(--panel)}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5;color:var(--muted)}
th{color:var(--text);background:rgba(120,145,200,.1)}
td:first-child{color:var(--text);font-weight:700}

.foot-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:15px;border-top:1px solid var(--line)}
.page-count,.tip{color:var(--muted);font-size:12px}
.next-btn{padding:10px 15px;border:0;border-radius:11px;color:#fff;font-weight:700;cursor:pointer;background:linear-gradient(120deg,#587cff,#a15df6)}

.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.67);backdrop-filter:blur(7px)}
.modal.open{display:grid}
.modal-box{width:min(800px,100%);max-height:86vh;overflow:auto;padding:23px;border-radius:20px;background:var(--panel-solid);border:1px solid var(--line);box-shadow:var(--shadow)}
.modal-top{display:flex;justify-content:space-between;gap:12px}
.close{width:38px;height:38px;font-size:21px;flex:0 0 auto}
#modalText{white-space:pre-line;line-height:1.8;color:var(--muted)}

@media(max-width:850px){
  aside{top:auto;bottom:0;left:0;right:0;width:auto;height:65px;padding:6px;display:flex;overflow-x:auto;border-right:0;border-top:1px solid var(--line)}
  .nav-label{display:none}
  .nav-btn{flex:0 0 auto;width:auto;white-space:nowrap;padding:9px;margin:0 3px}
  .nav-num{display:none}
  main{margin:0;padding:18px 13px 90px}
  .org-overview{grid-template-columns:1fr}
  .compare{grid-template-columns:1fr}
}
@media(max-width:540px){
  .topbar{padding:0 10px}.brand{font-size:13px}
  .hero{padding:25px 17px;min-height:260px}
  .metric-grid,.timeline{grid-template-columns:1fr}
  .bar-row{grid-template-columns:83px 1fr 48px}
}
</style>
</head>

<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">VC</span><span>Ներդրումային ռազմավարություններ</span></div>
  <div class="tools">
    <button class="tool" id="themeBtn" type="button" title="Լույս / մութ ռեժիմ">☼</button>
    <button class="tool" id="fullBtn" type="button" title="Ամբողջ էկրան">⛶</button>
  </div>
</header>

<aside>
  <div class="nav-label">Բաժիններ</div>
  <nav id="nav"></nav>
</aside>

<main id="main"></main>

<div class="modal" id="modal" aria-hidden="true">
  <section class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-top">
      <div><div class="eyebrow" id="modalEyebrow">Խոսնակի նյութ</div><h2 id="modalTitle"></h2></div>
      <button class="close" id="closeModal" type="button" aria-label="Փակել">×</button>
    </div>
    <div id="modalText"></div>
  </section>
</div>

<script>
"use strict";

const companies={
  sequoia:{name:"Sequoia Capital",color:"#24b985",speaker:"Սոֆյա"},
  softbank:{name:"SoftBank Vision Fund",color:"#f28c55",speaker:"Հայկուհի"},
  gv:{name:"GV (Google Ventures)",color:"#748fff",speaker:"Աշոտ"}
};

const slides=[
{
 title:"Միջազգային VC ռազմավարությունների համեմատություն",
 eyebrow:"Ներդրումների կառավարում · 2026",
 intro:"Sequoia Capital · SoftBank Vision Fund · GV։ Համեմատում ենք ներդրումների մասշտաբը և ռիսկերի կառավարումը ստարտափների ֆինանսավորման տարբեր փուլերում։",
 data:{
  sequoia:["Դասական VC գործընկերություն","Անկախ վենչուրային ֆիրմա, որը արտաքին LP-ներից ներգրավված կապիտալը ներդնում է ստարտափներում։ Պորտֆելում եղել են Apple-ը, Google-ը և Airbnb-ն։","Seed-ից մինչև growth՝ մի քանի փուլերում մասնակցելու հնարավորությամբ։","Դիվերսիֆիկացիա, փուլային ներդրում և ընտրված ընկերություններին հետագա աջակցություն։"],
  softbank:["Ուշ փուլի մեգա-ֆոնդ","SoftBank Group-ի ներդրումային հարթակ, որը հայտնի է խոշոր գործարքներով։ Vision Fund 1-ը 2017-ին փակվեց մոտ $98.6 մլրդ կապիտալով։","Հիմնականում late-stage, growth և pre-IPO փուլեր։","Խոշոր չեքեր և առաջատար ընկերությունների մասշտաբավորում, միաժամանակ՝ բարձր կենտրոնացվածության ռիսկ։"],
  gv:["Կորպորատիվ վենչուրային կապիտալ","Alphabet-ի ներդրումային թևն է։ Ներդրման հետ կարող է առաջարկել տեխնոլոգիական փորձ և գործարար կապեր։","Seed-ից growth՝ հիմնականում տեխնոլոգիաներում և life sciences-ում։","Ոլորտային փորձագիտություն և հնարավոր սիներգիա՝ շահերի բախման կառավարման անհրաժեշտությամբ։"]
 },
 script:"Աշխատանքը համեմատում է երեք տարբեր ներդրումային մոդել։ Sequoia-ն դասական VC գործընկերություն է, SoftBank Vision Fund-ը՝ ուշ փուլի մեգա-ֆոնդ, իսկ GV-ն՝ Alphabet-ի կորպորատիվ վենչուրային թևը։"
},
{
 title:"Կապիտալը և ֆինանսավորման փուլերը",
 eyebrow:"Ներդրման աղբյուր · չեքի չափ · փուլ",
 intro:"Կապիտալի աղբյուրն ազդում է ներդրողի ժամկետի, ռիսկի հանդեպ վերաբերմունքի և այն փուլի վրա, որտեղ նա առավել ակտիվ է։ Նշված չափերը մոտավոր միջակայքներ են։",
 data:{
  sequoia:["LP-ների կապիտալ","Ֆոնդը ներգրավում է արտաքին սահմանափակ գործընկերների միջոցները, իսկ GP-ները կառավարում են պորտֆելը։ Սա դասական ֆոնդային կառուցվածք է։","Seed՝ մոտ $0.5–3 մլն, Series A՝ $5–25 մլն, ուշ փուլերում՝ ավելի մեծ ներդրումներ։","Հիմնական առավելությունը մի քանի փուլերում ընկերությանը հետևելու և հաջող ռաունդներում լրացուցիչ ներդրում անելու հնարավորությունն է։"],
  softbank:["SoftBank և արտաքին խոշոր ներդրողներ","Vision Fund 1-ին մասնակցել են SoftBank-ը, PIF-ը, Mubadala-ն և այլ ներդրողներ։ Vision Fund 2-ը հիմնականում SoftBank-ի միջոցներով է։","Հարյուրավոր միլիոններից մինչև միլիարդավոր դոլարներ՝ հիմնականում ուշ փուլերում։","Մեծ կապիտալը կարող է արագացնել ընդլայնումը, բայց բարձրացնում է ներդրման արժեքի և իրացվելիության ռիսկը։"],
  gv:["Alphabet-ի կապիտալ","GV-ն կորպորատիվ ներդրումային թև է։ Բացի կապիտալից՝ հնարավոր են ոլորտային գիտելիք և Alphabet-ի տեխնոլոգիական կապեր։","Վաղ փուլում՝ սովորաբար մի քանի միլիոն, ընտրված ուշ գործարքներում՝ ավելի մեծ։","Երկարաժամկետ հորիզոնի կողքին պետք է կառավարել մայր ընկերության հետ հնարավոր շահերի բախումը։"]
 },
 extra:"stages",
 script:"Ֆինանսավորման սանդուղքում վաղ փուլում հիմնականում ֆինանսավորվում են գաղափարն ու արտադրանքի ստուգումը։ Growth փուլում արդեն ավելի շատ տվյալներ կան վաճառքի և ընդլայնման մասին։ Sequoia-ն ու GV-ն կարող են ներկա լինել մի քանի փուլերում, իսկ SoftBank-ը առավել ակտիվ է ուշ փուլում։"
},
{
 title:"Ռիսկի կառավարում և եկամտաբերություն",
 eyebrow:"Staging · դիվերսիֆիկացիա · գնահատում",
 intro:"Վաղ փուլում գերիշխում են ձախողման և արտադրանքի ռիսկերը։ Ուշ փուլում ավելի կարևոր են դառնում գնահատումը, կառավարումը, իրացվելիությունը և exit-ի հնարավորությունը։",

  gv:["Ռազմավարական ներդրող","Կորպորատիվ ներդրողի հետ համագործակցությունն արժեքավոր է, եթե կան հստակ օգուտներ՝ տեխնոլոգիա, հաճախորդներ կամ ոլորտային փորձ։","Պայմանագրում կարևոր են տվյալների գաղտնիությունն ու ընկերության անկախությունը։","Սիներգիան պետք է գնահատել կոնկրետ արդյունքներով, ոչ միայն որպես ընդհանուր խոստում։"]
 },
 extra:"final",
 script:"Հայաստանի ստարտափների համար միջազգային կապիտալը աճի հնարավորություն է, բայց դրա հետ գալիս են ներդրողի հետ աշխատանքի և կառավարման պահանջներ։ PicsArt-ի օրինակը ցույց է տալիս ուշ փուլի կապիտալի դերը։ Հիմնադիրները պետք է դիտարկեն ոչ միայն գնահատումը, այլև պայմանները, փորձն ու համատեղելիությունը։"
}
];

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderExtra(type){
  if(type==="stages") return `
    <div class="card" style="margin-top:13px">
      <h3>Ֆինանսավորման սանդուղք</h3>
      <div class="timeline">
        <div class="card time-item"><strong>Seed</strong><p>Գաղափար, թիմ, նախատիպ։</p></div>
        <div class="card time-item"><strong>Series A</strong><p>Արտադրանքի պահանջարկի ստուգում։</p></div>
        <div class="card time-item"><strong>Series B–C</strong><p>Մասշտաբավորում և վաճառքի աճ։</p></div>
        <div class="card time-item"><strong>Late / Pre-IPO</strong><p>Գնահատում, իրացվելիություն, exit։</p></div>
      </div>
    </div>`;

  if(type==="risk") return `
    <div class="card" style="margin-top:13px">
      <h3>Ուսումնական մոդելի կորուստների ենթադրական բաժինը</h3>
      <div class="bar-list">
        <div class="bar-row"><span>Seed / Early</span><div class="bar"><i style="width:50%"></i></div><b>50%</b></div>
        <div class="bar-row"><span>Series B–C</span><div class="bar"><i style="width:25%"></i></div><b>25%</b></div>
        <div class="bar-row"><span>Late / Pre-IPO</span><div class="bar"><i style="width:15%"></i></div><b>15%</b></div>
      </div>
      <p class="tip">Պարզեցված ուսումնական ենթադրություններ են, ոչ թե կազմակերպությունների փաստացի արդյունքները։</p>
    </div>`;

  if(type==="exits") return `
    <div class="table-wrap"><table>
      <thead><tr><th>Exit ուղի</th><th>Առավելություն</th><th>Հիմնական սահմանափակում</th></tr></thead>
      <tbody>
        <tr><td>IPO</td><td>Մասշտաբային իրացվելիություն և հանրային գնահատում։</td><td>Կախված է շուկայի պատուհանից և lock-up-ից։</td></tr>
        <tr><td>M&A</td><td>Ռազմավարական գնորդը կարող է արագացնել գործարքը։</td><td>Գնորդը պետք է գտնվի, իսկ ինտեգրումը՝ հաջողվի։</td></tr>
        <tr><td>Երկրորդային վաճառք</td><td>Մասնակի իրացվելիություն մինչև IPO-ն։</td><td>Կարող է լինել զեղչով և սահմանափակ պայմաններով։</td></tr>
      </tbody>
    </table></div>`;

  if(type==="summary") return `
    <div class="table-wrap"><table>
      <thead><tr><th>Չափանիշ</th><th>Sequoia</th><th>SoftBank VF</th><th>GV</th></tr></thead>
      <tbody>
        <tr><td>Մոդել</td><td>Դասական VC</td><td>Մեգա-ֆոնդ</td><td>Կորպորատիվ VC</td></tr>
        <tr><td>Հիմնական փուլ</td><td>Seed–Growth</td><td>Late-stage</td><td>Seed–Growth</td></tr>
        <tr><td>Հիմնական ուժ</td><td>Դիվերսիֆիկացիա և աջակցություն</td><td>Մեծ կապիտալ</td><td>Սիներգիա և փորձագիտություն</td></tr>
        <tr><td>Հիմնական ռիսկ</td><td>Ընտրություն և ձախողում</td><td>Գնահատում և կենտրոնացում</td><td>Շահերի բախում</td></tr>
      </tbody>
    </table></div>`;

  if(type==="final") return `
    <div class="compare">
      <div class="card"><h3 style="color:#24b985">Վաղ փուլ</h3><p>Թիմի, արտադրանքի և շուկայի ռիսկ․ կարևոր են փորձարկումն ու աջակցությունը։</p></div>
      <div class="card"><h3 style="color:#f28c55">Ուշ փուլ</h3><p>Գնահատման և governance-ի ռիսկ․ մեծ կապիտալը մեծ exit է պահանջում։</p></div>
      <div class="card"><h3 style="color:#748fff">CVC</h3><p>Ֆինանսական վերադարձի կողքին գնահատվում է ռազմավարական օգուտը։</p></div>
    </div>
    <div class="card" style="margin-top:13px">
      <h3>Հիմնական հարցը</h3>
      <p>Ինչպիսի՞ ներդրող, պայմաններ և աջակցություն են համապատասխանում տվյալ ստարտափի փուլին ու նպատակներին։</p>
    </div>`;
  return "";
}

let currentPage=0;
let selectedCompany="sequoia";

function render(){
  const nav=document.getElementById("nav");
  const main=document.getElementById("main");

  nav.innerHTML=slides.map((s,i)=>`
    <button class="nav-btn ${i===currentPage?"active":""}" data-page="${i}" type="button">
      <span class="nav-num">${String(i+1).padStart(2,"0")}</span>
      <span>${esc(s.title.length>29?s.title.slice(0,28)+"…":s.title)}</span>
    </button>`).join("");

  main.innerHTML=slides.map((s,i)=>`
    <article class="slide ${i===currentPage?"active":""}" data-slide="${i}">
      <section class="hero">
        <div class="speaker-corner">
          <button type="button" class="speaker-btn" data-script="${i}">▤ Խոսնակի նյութ</button>
        </div>
        <div class="eyebrow">${esc(s.eyebrow)}</div>
        <h1>${esc(s.title)}</h1>
        <p>${esc(s.intro)}</p>
      </section>

      <div class="content-head">
        <h2>Կազմակերպությունների համեմատություն</h2>
        <p>Ընտրեք կազմակերպությունը՝ տվյալ էջի համապատասխան նյութը դիտելու համար։</p>
      </div>

      <div class="org-tabs">
        ${Object.entries(companies).map(([key,c])=>`
          <button type="button" class="org-tab ${key===selectedCompany?"active":""}"
            data-company="${key}" style="--org:${c.color}">${esc(c.name)}</button>`).join("")}
      </div>

      ${Object.entries(companies).map(([key,c])=>{
        const d=s.data[key];
        return `<section class="org-panel ${key===selectedCompany?"active":""}" data-panel="${key}">
          <div class="org-overview">
            <div class="card accent-card" style="--org:${c.color}">
              <span class="tag">${esc(d[0])}</span>
              <h3 style="margin-top:12px">${esc(c.name)}</h3>
              <p>${esc(d[1])}</p>
            </div>
            <div class="card accent-card" style="--org:${c.color}">
              <h3>Փուլ և ներդրման չափ</h3><p>${esc(d[2])}</p>
              <h3 style="margin-top:13px">Ռիսկի կառավարում</h3><p>${esc(d[3])}</p>
            </div>
          </div>
          ${renderExtra(s.extra)}
        </section>`;
      }).join("")}

      <div class="foot-nav">
        <span class="page-count">Էջ ${i+1} / ${slides.length}</span>
        <div>
          <button type="button" class="tool" data-prev aria-label="Նախորդ էջ">←</button>
          <button type="button" class="next-btn" data-next>${i===slides.length-1?"Սկզբում":"Հաջորդ էջ"} →</button>
        </div>
      </div>
    </article>`).join("");

  bindEvents();
}

function bindEvents(){
  document.querySelectorAll("[data-page]").forEach(b=>
    b.addEventListener("click",()=>goTo(Number(b.dataset.page)))
  );
  document.querySelectorAll("[data-company]").forEach(b=>
    b.addEventListener("click",()=>{
      selectedCompany=b.dataset.company;
      updateCompany();
    })
  );
  document.querySelectorAll("[data-script]").forEach(b=>
    b.addEventListener("click",()=>openScript(Number(b.dataset.script)))
  );
  document.querySelectorAll("[data-next]").forEach(b=>
    b.addEventListener("click",()=>goTo((currentPage+1)%slides.length))
  );
  document.querySelectorAll("[data-prev]").forEach(b=>
    b.addEventListener("click",()=>goTo((currentPage-1+slides.length)%slides.length))
  );
}

function updateCompany(){
  document.querySelectorAll(".org-tab").forEach(b=>
    b.classList.toggle("active",b.dataset.company===selectedCompany)
  );
  document.querySelectorAll(".org-panel").forEach(p=>
    p.classList.toggle("active",p.dataset.panel===selectedCompany)
  );
}

function goTo(index){
  currentPage=index;
  document.querySelectorAll(".slide").forEach((s,i)=>s.classList.toggle("active",i===index));
  document.querySelectorAll(".nav-btn").forEach((b,i)=>b.classList.toggle("active",i===index));
  window.scrollTo({top:0,behavior:"smooth"});
}

function openScript(index){
  const c=companies[selectedCompany];
  document.getElementById("modalEyebrow").textContent=`${c.name} · խոսնակ՝ ${c.speaker}`;
  document.getElementById("modalTitle").textContent=slides[index].title;
  document.getElementById("modalText").textContent=slides[index].script;
  document.getElementById("modal").classList.add("open");
  document.getElementById("modal").setAttribute("aria-hidden","false");
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.getElementById("modal").setAttribute("aria-hidden","true");
}

document.getElementById("closeModal").addEventListener("click",closeModal);
document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal") closeModal();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeModal();
  if(e.key==="ArrowRight") goTo((currentPage+1)%slides.length);
  if(e.key==="ArrowLeft") goTo((currentPage-1+slides.length)%slides.length);
});
document.getElementById("themeBtn").addEventListener("click",()=>{
  document.body.classList.toggle("light");
  document.getElementById("themeBtn").textContent=
    document.body.classList.contains("light")?"☾":"☼";
});
document.getElementById("fullBtn").addEventListener("click",async()=>{
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch{
    alert("Ամբողջ էկրանով ռեժիմը հասանելի չէ այս բրաուզերում։");
  }
});

render();
</script>
</body>
</html>
